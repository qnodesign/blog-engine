name: Daily build and publish

on:
  schedule:
    - cron: '5 7-18 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - name: Check out the blog source
        uses: actions/checkout@v4

      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          repository: konihausblog/konihausblog.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build into the published folder
        run: npx eleventy --output=pages

      - name: Commit and push if something changed
        working-directory: pages
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "konihaus-blog-bot"
          git config user.email "hallo@konihaus.ch"
          git add -A
          git commit -m "daily build $(date +%F)"
          git push
